<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Role map for Sierra College Makerspace and Vanquish Products</title>
  <desc id="desc">A diagram summarizing equipment support, training, production finishing, inventory, packaging, and shipping responsibilities. It is an illustrated role map, not a workplace photograph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a1f"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb45d"/>
      <stop offset="1" stop-color="#f27a1a"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#f27a1a" fill-opacity=".35"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1410" cy="90" r="300" fill="#f27a1a" fill-opacity=".07"/>
  <path d="M800 150V750" stroke="#f27a1a" stroke-opacity=".22" stroke-width="2" stroke-dasharray="6 16"/>
  <text x="90" y="85" fill="#ff9b49" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="4">ROLE MAP · NO WORKPLACE PHOTOS USED</text>
  <text x="90" y="142" fill="#f5f1e9" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700">Hands-on support across two early roles</text>
  <g transform="translate(90 205)">
    <rect width="660" height="545" rx="28" fill="#15181d" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="0" y="0" width="8" height="545" rx="4" fill="url(#orange)"/>
    <text x="46" y="72" fill="#ff9b49" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="3">SIERRA COLLEGE</text>
    <text x="46" y="125" fill="#f5f1e9" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Makerspace Technical Assistant</text>
    <text x="46" y="168" fill="#9da3ad" font-family="Inter, Arial, sans-serif" font-size="22">Helped students use equipment safely and complete real projects.</text>
    <g font-family="Inter, Arial, sans-serif" font-size="23" fill="#d8dbe0">
      <circle cx="60" cy="242" r="8" fill="#f27a1a"/><text x="88" y="250">3D printers, CNC routers, and laser systems</text>
      <circle cx="60" cy="304" r="8" fill="#f27a1a"/><text x="88" y="312">CAD/CAM and print-workflow support</text>
      <circle cx="60" cy="366" r="8" fill="#f27a1a"/><text x="88" y="374">User training, troubleshooting, and maintenance</text>
      <circle cx="60" cy="428" r="8" fill="#f27a1a"/><text x="88" y="436">Woodworking, vinyl, embroidery, and shop safety</text>
    </g>
    <rect x="46" y="482" width="568" height="1" fill="#ffffff" fill-opacity=".1"/>
    <text x="46" y="520" fill="#8f969f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2">SETUP → TRAIN → TROUBLESHOOT → HAND OFF</text>
  </g>
  <g transform="translate(850 205)">
    <rect width="660" height="545" rx="28" fill="#15181d" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="652" y="0" width="8" height="545" rx="4" fill="url(#orange)"/>
    <text x="46" y="72" fill="#ff9b49" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="3">VANQUISH PRODUCTS / ASB PRODUCTS</text>
    <text x="46" y="125" fill="#f5f1e9" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Inventory &amp; Factory Support</text>
    <text x="46" y="168" fill="#9da3ad" font-family="Inter, Arial, sans-serif" font-size="22">Supported the flow of machined RC-car parts through finishing and shipping.</text>
    <g font-family="Inter, Arial, sans-serif" font-size="23" fill="#d8dbe0">
      <circle cx="60" cy="242" r="8" fill="#f27a1a"/><text x="88" y="250">Inventory management and production staging</text>
      <circle cx="60" cy="304" r="8" fill="#f27a1a"/><text x="88" y="312">Deburring, polishing, cleaning, and inspection</text>
      <circle cx="60" cy="366" r="8" fill="#f27a1a"/><text x="88" y="374">Prep for anodizing and laser etching</text>
      <circle cx="60" cy="428" r="8" fill="#f27a1a"/><text x="88" y="436">Packaging, shipping, and vendor processing</text>
    </g>
    <rect x="46" y="482" width="568" height="1" fill="#ffffff" fill-opacity=".1"/>
    <text x="46" y="520" fill="#8f969f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2">RECEIVE → FINISH → INSPECT → PACK → SHIP</text>
  </g>
  <g transform="translate(760 770)" filter="url(#glow)">
    <circle cx="40" cy="40" r="34" fill="#111419" stroke="#f27a1a" stroke-width="2"/>
    <path d="M22 40h36M40 22v36" stroke="#f27a1a" stroke-width="3"/>
  </g>
  <text x="800" y="850" text-anchor="middle" fill="#747b85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2">ILLUSTRATED RESPONSIBILITY MAP · NOT A PHOTOGRAPH</text>
</svg>
